name: Build and Deploy Quartz

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Quartz
        run: |
          cd /tmp
          git clone https://github.com/jackyzha0/quartz.git quartz-temp
          cd quartz-temp
          git checkout v4.5.2
          npm ci

      - name: Copy content to Quartz
        run: |
          cp -r $GITHUB_WORKSPACE/estudiantes/* /tmp/quartz-temp/content/

      - name: Patch Quartz config
        working-directory: /tmp/quartz-temp
        run: |
          sed -i 's/pageTitle: "Quartz 4"/pageTitle: "LéELE"/' quartz.config.ts
          sed -i 's/pageTitleSuffix: ""/pageTitleSuffix: ""/' quartz.config.ts
          sed -i 's/\["frontmatter", "git", "filesystem"\]/["filesystem"]/' quartz.config.ts

      - name: Build Quartz
        working-directory: /tmp/quartz-temp
        run: npx quartz build

      - name: Assemble site
        run: |
          mkdir -p /tmp/site
          cp $GITHUB_WORKSPACE/index.html /tmp/site/
          cp $GITHUB_WORKSPACE/style.css /tmp/site/
          cp -r $GITHUB_WORKSPACE/imagenes /tmp/site/
          mkdir -p /tmp/site/estudiantes
          cp -r /tmp/quartz-temp/public/* /tmp/site/estudiantes/
          mv /tmp/site/estudiantes/estudiantes/* /tmp/site/estudiantes/ 2>/dev/null || true
          rmdir /tmp/site/estudiantes/estudiantes 2>/dev/null || true
          touch /tmp/site/.nojekyll

      - name: Inject hide script and styles
        run: |
          cp $GITHUB_WORKSPACE/hide-explorer.js /tmp/hide-explorer.js
          cp $GITHUB_WORKSPACE/student.css /tmp/student.css
          python3 -c "
          import glob
          with open('/tmp/hide-explorer.js', 'r') as f:
              js = f.read()
          with open('/tmp/student.css', 'r') as f:
              css = f.read()
          style_tag = '<style>' + css + '</style>'
          for html_file in glob.glob('/tmp/site/estudiantes/**/*.html', recursive=True):
              with open(html_file, 'r') as f:
                  content = f.read()
              content = content.replace('Quartz 4', 'LéELE')
              content = content.replace('Quartz v4.5.2', 'LéELE')
              content = content.replace('Folder:', 'Carpeta:')
              content = content.replace('</head>', style_tag + '</head>')
              content = content.replace('</body>', '<script>' + js + '</script></body>')
              with open(html_file, 'w') as f:
                  f.write(content)
          "

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
