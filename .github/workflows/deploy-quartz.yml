name: Build and Deploy Quartz

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Quartz
        run: |
          cd /tmp
          git clone https://github.com/jackyzha0/quartz.git quartz-temp
          cd quartz-temp
          git checkout v4.5.2
          npm ci

      - name: Copy content to Quartz
        run: |
          cp -r $GITHUB_WORKSPACE/estudiantes /tmp/quartz-temp/content/

      - name: Build Quartz
        working-directory: /tmp/quartz-temp
        run: npx quartz build

      - name: Assemble site
        run: |
          mkdir -p /tmp/site
          cp $GITHUB_WORKSPACE/index.html /tmp/site/
          cp $GITHUB_WORKSPACE/style.css /tmp/site/
          cp -r $GITHUB_WORKSPACE/imagenes /tmp/site/
          mkdir -p /tmp/site/estudiantes
          cp -r /tmp/quartz-temp/public/* /tmp/site/estudiantes/
          mv /tmp/site/estudiantes/estudiantes/* /tmp/site/estudiantes/ 2>/dev/null || true
          rmdir /tmp/site/estudiantes/estudiantes 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
